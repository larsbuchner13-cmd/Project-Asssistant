name: Quality

on:
  pull_request:
  push:
    branches:
      - claude/pm-copilot-web-app-y40wv4

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/pmcopilot
          DIRECT_URL: postgresql://user:password@localhost:5432/pmcopilot
          NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
          NEXTAUTH_URL: http://localhost:3000
